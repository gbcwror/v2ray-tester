name: Test v2ray Configs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write

env:
  REPO_URL: "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check sources
        id: check
        run: |
          HAS_SUBS=false
          HAS_CHANNELS=false

          if [ -s subscription.txt ] && grep -qv '^\s*#' subscription.txt 2>/dev/null; then
            if grep -qv '^\s*$' subscription.txt 2>/dev/null; then
              HAS_SUBS=true
            fi
          fi

          if [ -s channels.txt ] && grep -qv '^\s*#' channels.txt 2>/dev/null; then
            if grep -qv '^\s*$' channels.txt 2>/dev/null; then
              HAS_CHANNELS=true
            fi
          fi

          if [ "$HAS_SUBS" = false ] && [ "$HAS_CHANNELS" = false ]; then
            echo "No active subscriptions or channels. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Go
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: true

      - name: Download dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          go get github.com/xtls/xray-core@latest
          go get github.com/PuerkitoBio/goquery@v1.12.0
          go mod tidy

      - name: Build
        if: steps.check.outputs.skip != 'true'
        run: go build -o tester ./cmd/tester

      - name: Run tester
        if: steps.check.outputs.skip != 'true'
        run: ./tester --config config.json --repo-url "$REPO_URL"

      - name: Commit results
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add REPORT.md configs/ cloudflare-ips.txt go.mod go.sum 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update configs $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi